el"><p>any alarm degrades autonomy one rung down — the floor is always safe</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-O-0" data-look="classic" transform="translate(270.5, 84)"><rect class="basic label-container" style="" x="-130" y="-76" width="260" height="152"/><g class="label" style="" transform="translate(-100, -61)"><rect/><foreignObject width="200" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>OBSERVE</b> — report only<br />loop: reports · human: reads &amp; acts<br /><code>loop-audit</code>, <code>loop-review</code></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-V-1" data-look="classic" transform="translate(270.5, 297.5)"><rect class="basic label-container" style="" x="-130" y="-87.5" width="260" height="175"/><g class="label" style="" transform="translate(-100, -72.5)"><rect/><foreignObject width="200" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>VERIFY</b> — propose, human merges<br />loop: acts on a branch + adversarial verify · human: approves &amp; merges<br /><code>loop-autopilot</code> (default)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S-2" data-look="classic" transform="translate(138, 535)"><rect class="basic label-container" style="" x="-130" y="-100" width="260" height="200"/><g class="label" style="" transform="translate(-100, -85)"><rect/><foreignObject width="200" height="170"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>SUSTAIN</b> — keep the loop honest<br />loop: detects its own gaming / drift · human: reads the alarms<br /><code>verifier-integrity</code> + <code>held-out-eval</code> (AP6)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-3" data-look="classic" transform="translate(270.5, 797.5)"><rect class="basic label-container" style="" x="-130" y="-112.5" width="260" height="225"/><g class="label" style="" transform="translate(-100, -97.5)"><rect/><foreignObject width="200" height="195"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>SCALE</b> — autonomous delivery <i>(off by default)</i><br />loop: merges behind a canary + self-rolls-back · human: handles exceptions<br /><code>deployment.md §Advanced</code> + <code>canary-merge</code></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>