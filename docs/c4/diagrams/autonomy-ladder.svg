d="L_V_S_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_S_C_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(403, 426.75)"><g class="label" data-id="L_C_V_0" transform="translate(-100, -29.25)"><foreignObject width="200" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>any alarm degrades autonomy one rung down — the floor is always safe</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default r1" id="my-svg-flowchart-O-0" data-look="classic" transform="translate(270.5, 62)"><rect class="basic label-container" style="fill:#CCFBF1 !important;stroke:#0F766E !important" x="-130" y="-54" width="260" height="108"/><g class="label" style="color:#042F2E !important" transform="translate(-100, -39)"><rect/><foreignObject width="200" height="78"><div style="color: rgb(4, 47, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#042F2E !important" class="nodeLabel"><p><b>OBSERVE</b> — report only<br />loop: reports · human: reads &amp; acts<br /><code>loop-audit</code>, <code>loop-review</code></p></span></div></foreignObject></g></g><g class="node default r2" id="my-svg-flowchart-V-1" data-look="classic" transform="translate(270.5, 239.5)"><rect class="basic label-container" style="fill:#99F6E4 !important;stroke:#0F766E !important" x="-130" y="-73.5" width="260" height="147"/><g class="label" style="color:#042F2E !important" transform="translate(-100, -58.5)"><rect/><foreignObject width="200" height="117"><div style="color: rgb(4, 47, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#042F2E !important" class="nodeLabel"><p><b>VERIFY</b> — propose, human merges<br />loop: acts on a branch + adversarial verify · human: approves &amp; merges<br /><code>loop-autopilot</code> (default)</p></span></div></foreignObject></g></g><g class="node default r3" id="my-svg-flowchart-S-2" data-look="classic" transform="translate(138, 426.75)"><rect class="basic label-container" style="fill:#5EEAD4 !important;stroke:#0F766E !important" x="-130" y="-63.75" width="260" height="127.5"/><g class="label" style="color:#042F2E !important" transform="translate(-100, -48.75)"><rect/><foreignObject width="200" height="97.5"><div style="color: rgb(4, 47, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#042F2E !important" class="nodeLabel"><p><b>SUSTAIN</b> — keep the loop honest<br />loop: detects its own gaming / drift · human: reads the alarms<br /><code>verifier-integrity</code> + <code>held-out-eval</code> (AP6)</p></span></div></foreignObject></g></g><g class="node default r4" id="my-svg-flowchart-C-3" data-look="classic" transform="translate(270.5, 623.75)"><rect class="basic label-container" style="fill:#F0FDFA !important;stroke:#0F766E !important;stroke-dasharray:6 4 !important" x="-130" y="-83.25" width="260" height="166.5"/><g class="label" style="color:#042F2E !important" transform="translate(-100, -68.25)"><rect/><foreignObject width="200" height="136.5"><div style="color: rgb(4, 47, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#042F2E !important" class="nodeLabel"><p><b>SCALE</b> — autonomous delivery <i>(off by default)</i><br />loop: merges behind a canary + self-rolls-back · human: handles exceptions<br /><code>deployment.md §Advanced</code> + <code>canary-merge</code></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>