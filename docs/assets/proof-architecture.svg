<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="504" viewBox="0 0 1030 504" role="img" aria-labelledby="title description">
<title id="title">Proof — from a goal to checked evidence</title>
<desc id="description">Skills load into an authoring session governed by shared policies and assisted by MCP tools. The host executes the workflow and returns evidence to a human gate. Portable packs are generated separately.</desc>
<style>
:root{color-scheme:light dark;--bg:#f7fafc;--card:#fff;--ink:#102838;--muted:#4c6373;--stroke:#bfd3df;--accent:#007c83;--support:#61748d;--policy:#a6491c;--policy-bg:#fff2e8}
@media(prefers-color-scheme:dark){:root{--bg:#101c28;--card:#172b3b;--ink:#edf7fa;--muted:#aec4d0;--stroke:#466479;--accent:#65e2d2;--support:#9aaed0;--policy:#ffbe8c;--policy-bg:#3a2d29}}
text{font-family:Arial,sans-serif;fill:var(--ink)}
.node-title{font-size:20px;font-weight:700}.node-detail{font-size:13px;fill:var(--muted)}
.edge-label{font-size:14px;fill:var(--muted)}.note{font-size:14px;fill:var(--muted)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}.governance{fill:var(--policy-bg);stroke:var(--policy);stroke-width:1.5}
.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.support{stroke:var(--support);stroke-dasharray:6 5;marker-end:url(#support-arrow)}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--accent)"/></marker><marker id="support-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--support)"/></marker></defs>
<rect width="1030" height="504" rx="18" fill="var(--bg)"/>
<g data-edge-id="load-skill"><path class="edge" d="M270,240L400,240"/><rect x="311" y="206" width="48" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="335" y="222" text-anchor="middle">load</text></g>
<g data-edge-id="report-evidence"><path class="edge" d="M630,240L760,240"/><rect x="663" y="206" width="64" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="695" y="222" text-anchor="middle">report</text></g>
<g data-edge-id="read-policy"><path class="edge support" d="M515,120L515,200"/><rect x="483" y="144" width="64" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="515" y="160" text-anchor="middle">govern</text></g>
<g data-edge-id="build-packs"><path class="edge support" d="M155,280L155,360"/><rect x="119" y="304" width="72" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="155" y="320" text-anchor="middle">package</text></g>
<g data-edge-id="authoring-advice"><path class="edge support" d="M515,360L515,280"/><rect x="483" y="304" width="64" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="515" y="320" text-anchor="middle">advise</text></g>
<g data-edge-id="execute-script"><path class="edge support" d="M630,260L695,260L695,400L760,400"/><rect x="631" y="314" width="128" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="695" y="330" text-anchor="middle">execute script</text></g>
<g data-edge-id="return-evidence"><path class="edge support" d="M875,360L875,280"/><rect x="843" y="304" width="64" height="22" rx="4" fill="var(--bg)"/><text class="edge-label" x="875" y="320" text-anchor="middle">return</text></g>
<g data-node-id="skill-library"><rect class="card" x="40" y="200" width="230" height="80" rx="12"/><text class="node-title" x="155" y="235" text-anchor="middle">Skill library</text><text class="node-detail" x="155" y="259" text-anchor="middle">26 focused engineering skills</text></g>
<g data-node-id="authoring-session"><rect class="card" x="400" y="200" width="230" height="80" rx="12"/><text class="node-title" x="515" y="235" text-anchor="middle">Agent session</text><text class="node-detail" x="515" y="259" text-anchor="middle">Choose · plan · work</text></g>
<g data-node-id="phase-result"><rect class="governance" x="760" y="200" width="230" height="80" rx="12"/><text class="node-title" x="875" y="235" text-anchor="middle">Evidence + next step</text><text class="node-detail" x="875" y="259" text-anchor="middle">Checked artifacts · human gate</text></g>
<g data-node-id="shared-policy"><rect class="governance" x="400" y="40" width="230" height="80" rx="12"/><text class="node-title" x="515" y="75" text-anchor="middle">Shared policies</text><text class="node-detail" x="515" y="99" text-anchor="middle">Scope · routes · bounded loops</text></g>
<g data-node-id="portable-skills"><rect class="card" x="40" y="360" width="230" height="80" rx="12"/><text class="node-title" x="155" y="395" text-anchor="middle">Portable packs</text><text class="node-detail" x="155" y="419" text-anchor="middle">22 skills · sequential path</text></g>
<g data-node-id="authoring-tools"><rect class="card" x="400" y="360" width="230" height="80" rx="12"/><text class="node-title" x="515" y="395" text-anchor="middle">proof-mcp</text><text class="node-detail" x="515" y="419" text-anchor="middle">Source-backed authoring advice</text></g>
<g data-node-id="workflow-runtime"><rect class="card" x="760" y="360" width="230" height="80" rx="12"/><text class="node-title" x="875" y="395" text-anchor="middle">Host Workflow</text><text class="node-detail" x="875" y="419" text-anchor="middle">When supported + authorized</text></g>
<text class="note" x="40" y="480">Main path: skill → work → evidence. Dashed: packaging, advice and optional Workflow.</text></svg>
