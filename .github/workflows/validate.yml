name: validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The real gate. `claude plugin validate` only reads the marketplace
      # manifest — it never opens a SKILL.md, which is how two skills once
      # shipped with frontmatter that no YAML parser would load. This script
      # checks the surface that actually matters: frontmatter, ROUTES drift,
      # H10 determinism, and cross-reference paths.
      - name: Validate plugin
        run: node scripts/validate.mjs

      # Static validation proves a template PARSES. This executes all 25 against stubbed
      # Workflow globals and asserts on the agent() options they actually ask for — that
      # --mode full really pins the fleet, that optimize really routes below the ceiling,
      # and that --planner fable reaches a planner node. Four templates shipped mode-inert
      # before this existed.
      - name: Smoke-test workflow templates
        run: node scripts/smoke.mjs
